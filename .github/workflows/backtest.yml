name: Backtest Strategy

concurrency:
  group: phase2-backtest-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [phase-2-data-developer]
    paths:
      - ".github/workflows/backtest.yml"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - "data/**"
  workflow_dispatch:
    inputs:
      start:
        description: "Start date"
        required: false
        default: "2021-01-01"
      end:
        description: "End date"
        required: false
        default: "2026-09-30"
      brokerage:
        description: "Paytm Money brokerage per order"
        required: false
        default: "20"
      slippage_ticks:
        description: "Option ticks of adverse slippage"
        required: false
        default: "1"

permissions:
  contents: write

jobs:
  test-and-backtest:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HOME: ~/.cache/huggingface
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Hugging Face data
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            data/cache
          key: hf-trademarkk-nifty-expiry-options-v1-${{ runner.os }}-2021-2026
          restore-keys: |
            hf-trademarkk-nifty-expiry-options-v1-${{ runner.os }}-

      - name: Install
        run: pip install -r requirements.txt pytest

      - name: Unit tests
        run: |
          set -o pipefail
          PYTHONPATH=. python -m pytest -q 2>&1 | tee ci-test-output.txt

      - name: Record CI test output
        if: failure()
        run: |
          git config user.name "research-bot"
          git config user.email "research-bot@users.noreply.github.com"
          git add ci-test-output.txt
          git diff --cached --quiet || git commit -m "Record CI test output"
          git push

      - name: Run backtest
        run: |
          set -o pipefail
          PYTHONPATH=. python scripts/backtest.py \
            --start "${{ inputs.start || '2021-01-01' }}" \
            --end "${{ inputs.end || '2026-09-30' }}" \
            --brokerage "${{ inputs.brokerage || '20' }}" \
            --slippage-ticks "${{ inputs.slippage_ticks || '1' }}" 2>&1 | tee backtest-output.txt

      - name: Record backtest output
        if: failure()
        run: |
          git config user.name "research-bot"
          git config user.email "research-bot@users.noreply.github.com"
          git add backtest-output.txt
          git diff --cached --quiet || git commit -m "Record CI backtest output"
          git push

      - name: Upload run artifact
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: results/

      - name: Commit results
        run: |
          git config user.name "research-bot"
          git config user.email "research-bot@users.noreply.github.com"
          git add results/
          git diff --cached --quiet || git commit -m "Record automated backtest results"
          git push
