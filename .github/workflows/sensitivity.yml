name: Phase 3 Reversal Sensitivity

concurrency:
  group: phase3-robustness-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [phase-3-robustness-developer]
    paths:
      - ".github/workflows/sensitivity.yml"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-partition:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {year: 2021, start: 2020-11-20, end: 2021-12-31}
          - {year: 2022, start: 2021-11-20, end: 2022-12-31}
          - {year: 2023, start: 2022-11-20, end: 2023-12-31}
          - {year: 2024, start: 2023-11-20, end: 2024-12-31}
          - {year: 2025, start: 2024-11-20, end: 2025-12-31}
          - {year: 2026, start: 2025-11-20, end: 2026-09-30}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HOME: ~/.cache/huggingface
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache Hugging Face data
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            data/cache
          key: hf-trademarkk-nifty-expiry-options-v1-${{ runner.os }}-2021-2026
          restore-keys: |
            hf-trademarkk-nifty-expiry-options-v1-${{ runner.os }}-
      - name: Install
        run: pip install -r requirements.txt
      - name: Stage free sources
        run: PYTHONPATH=. python scripts/stage_free_sources.py --start "${{ matrix.start }}" --end "${{ matrix.end }}" --cache-root data/cache
      - name: Build composite partition
        run: PYTHONPATH=. python scripts/composite_data.py --start "${{ matrix.start }}" --end "${{ matrix.end }}" --out "results/partitions/${{ matrix.year }}"
      - name: Upload partition
        uses: actions/upload-artifact@v4
        with:
          name: phase3-partition-${{ matrix.year }}
          path: |
            results/partitions/${{ matrix.year }}/nifty_options_composite.parquet
            results/partitions/${{ matrix.year }}/composite_manifest.json

  assemble-composite:
    needs: build-partition
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Download partitions
        uses: actions/download-artifact@v4
        with:
          pattern: phase3-partition-*
          path: results/partitions
          merge-multiple: false
      - name: Normalize partition layout
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path("results/partitions")
          for d in list(root.glob("phase3-partition-*")):
              year = d.name.rsplit("-", 1)[-1]
              target = root / year
              target.mkdir(parents=True, exist_ok=True)
              for p in d.rglob("*"):
                  if p.is_file():
                      dest = target / p.name
                      if not dest.exists():
                          dest.write_bytes(p.read_bytes())
          PY
      - name: Assemble composite
        run: PYTHONPATH=. python scripts/merge_composite_partitions.py --start 2021-01-01 --end 2026-09-30
      - name: Check research-use coverage
        run: PYTHONPATH=. python scripts/check_composite_coverage.py --research-use
      - name: Reconcile canonical composite
        run: |
          PYTHONPATH=. python scripts/export_composite_csv.py
          PYTHONPATH=. python scripts/reconcile_composite_csv.py
      - name: Upload sensitivity composite
        uses: actions/upload-artifact@v4
        with:
          name: phase3-composite
          path: |
            results/composite/nifty_options_composite.parquet
            results/composite/composite_manifest.json
            results/composite/cycle_coverage.csv
            results/composite/research_use_data_status.json
            results/composite/csv_reconciliation.json

  sensitivity:
    needs: assemble-composite
    strategy:
      fail-fast: false
      matrix:
        reversal: ["0.80", "1.00", "1.20", "1.30"]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Download sensitivity composite
        uses: actions/download-artifact@v4
        with:
          name: phase3-composite
          path: results/composite
      - name: Run threshold backtest
        run: |
          PYTHONPATH=. python scripts/backtest.py \
            --start 2021-01-01 \
            --end 2026-09-30 \
            --brokerage 20 \
            --slippage-ticks 1 \
            --continuation-delta-threshold 0.20 \
            --reversal-delta-threshold "${{ matrix.reversal }}" \
            --entry-mode available \
            --out "results/sensitivity/${{ matrix.reversal }}"
      - name: Upload threshold result
        uses: actions/upload-artifact@v4
        with:
          name: phase3-sensitivity-${{ matrix.reversal }}
          path: results/sensitivity/${{ matrix.reversal }}/

  aggregate:
    needs: sensitivity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download threshold results
        uses: actions/download-artifact@v4
        with:
          pattern: phase3-sensitivity-*
          path: results/sensitivity
          merge-multiple: false
      - name: Aggregate
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import pandas as pd
          root = Path("results/sensitivity")
          rows = []
          for d in sorted(root.glob("phase3-sensitivity-*")):
              threshold = d.name.rsplit("-", 1)[-1]
              metrics_path = d / "metrics.json"
              manifest_path = d / "run_manifest.json"
              metrics = json.loads(metrics_path.read_text()) if metrics_path.exists() else {}
              manifest = json.loads(manifest_path.read_text()) if manifest_path.exists() else {}
              rows.append({
                  "reversal_delta_threshold": float(threshold),
                  **metrics,
                  "entry_mode": manifest.get("entry_mode"),
                  "brokerage": manifest.get("brokerage"),
                  "slippage_ticks": manifest.get("slippage_ticks"),
                  "research_use_partial_data": manifest.get("research_use_partial_data"),
              })
          out = pd.DataFrame(rows).sort_values("reversal_delta_threshold")
          Path("results").mkdir(exist_ok=True)
          out.to_csv("results/phase3_sensitivity_summary.csv", index=False)
          Path("results/phase3_sensitivity_summary.json").write_text(out.to_json(orient="records", indent=2))
          print(out.to_string(index=False))
          PY
      - name: Commit lightweight sensitivity summary
        run: |
          git config user.name "research-bot"
          git config user.email "research-bot@users.noreply.github.com"
          git add results/phase3_sensitivity_summary.csv results/phase3_sensitivity_summary.json
          git diff --cached --quiet || git commit -m "Record Phase 3 reversal sensitivity summary"
          git push
